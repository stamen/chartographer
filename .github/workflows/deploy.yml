name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to build and deploy'
        required: false
        default: main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build and deploy to gh-pages
        env:
          GIT_DEPLOY_USER: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        run: npm run deploy
